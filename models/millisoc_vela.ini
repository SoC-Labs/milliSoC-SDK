; milliSoC Ethos-U85 Vela configuration.
;
; Weights (read-only) are placed on the Axi1 port, which the SoC wires to the
; QSPI flash / XiP window.  Feature maps, scratch and the fast scratch buffer
; are placed on the Axi0 port, which is the 0x30000000 SRAM that the Ethos-U
; can access directly.
;
; The command stream itself is not part of this memory plan: the runtime places
; it in flash and selects the command-fetch memory attribute with QCONFIG.

[System_Config.MilliSoC_U85]
core_clock=1e9
axi0_port=Sram
axi1_port=OffChipFlash
Sram_clock_scale=1.0
Sram_ports_used=2
Sram_burst_length=64
Sram_read_latency=32
Sram_write_latency=32
Sram_max_reads=8
Sram_max_writes=8
OffChipFlash_clock_scale=0.0625
OffChipFlash_ports_used=1
OffChipFlash_burst_length=128
OffChipFlash_read_latency=64
OffChipFlash_write_latency=0
OffChipFlash_max_reads=2
OffChipFlash_max_writes=0

; Weights live in flash (Axi1); the arena and scratch live in SRAM (Axi0).
[Memory_Mode.MilliSoC_Flash]
const_mem_area=Axi1
arena_mem_area=Axi0
cache_mem_area=Axi0
